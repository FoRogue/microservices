services:
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth-service
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://auth:auth@auth-db:5432/auth?sslmode=disable
      JWT_SECRET: dev-secret-change-me
    ports:
      - "8081:8081"
    depends_on:
      auth-db:
        condition: service_healthy

  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    ports:
      - "5434:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog-service:
    build: ./catalog-service
    environment:
      PORT: "8082"
      DATABASE_URL: postgres://catalog:catalog@catalog-db:5432/catalog?sslmode=disable
    ports:
      - "8082:8082"
    depends_on:
      catalog-db:
        condition: service_healthy

  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
      POSTGRES_DB: payment
    ports:
      - "5435:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-service:
    build:
      context: ./payment-service
      additional_contexts:
        eventing: ./eventing
    environment:
      PORT: "8083"
      DATABASE_URL: postgres://payment:payment@payment-db:5432/payment?sslmode=disable
      KAFKA_BROKERS: kafka:29092
    ports:
      - "8083:8083"
    depends_on:
      payment-db:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "5436:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-service:
    build:
      context: ./order-service
      additional_contexts:
        eventing: ./eventing
    environment:
      PORT: "8084"
      DATABASE_URL: postgres://orders:orders@order-db:5432/orders?sslmode=disable
      AUTH_URL: http://auth-service:8081
      CATALOG_URL: http://catalog-service:8082
      KAFKA_BROKERS: kafka:29092
    ports:
      - "8084:8084"
    depends_on:
      order-db:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:29092,HOST://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-topics:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for topic in payments.requested payments.completed; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create \
            --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done

volumes:
  auth-db-data:
  catalog-db-data:
  payment-db-data:
  order-db-data:
  kafka-data:
