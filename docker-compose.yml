services:
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth-service
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://auth:auth@auth-db:5432/auth?sslmode=disable
      JWT_SECRET: dev-secret-change-me
    ports:
      - "8081:8081"
    depends_on:
      auth-db:
        condition: service_healthy

  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    ports:
      - "5434:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog-service:
    build: ./catalog-service
    environment:
      PORT: "8082"
      DATABASE_URL: postgres://catalog:catalog@catalog-db:5432/catalog?sslmode=disable
    ports:
      - "8082:8082"
    depends_on:
      catalog-db:
        condition: service_healthy

  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
      POSTGRES_DB: payment
    ports:
      - "5435:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-service:
    build: ./payment-service
    environment:
      PORT: "8083"
      DATABASE_URL: postgres://payment:payment@payment-db:5432/payment?sslmode=disable
    ports:
      - "8083:8083"
    depends_on:
      payment-db:
        condition: service_healthy

volumes:
  auth-db-data:
  catalog-db-data:
  payment-db-data:
