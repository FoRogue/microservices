services:
  auth-service:
    ports: !override ["127.0.0.1:28081:8081"]
  auth-db:
    ports: !reset []
  catalog-service:
    ports: !override ["127.0.0.1:28082:8082"]
  catalog-db:
    ports: !reset []
  payment-service:
    ports: !override ["127.0.0.1:28083:8083"]
  payment-db:
    ports: !reset []
  order-service:
    ports: !override ["127.0.0.1:28084:8084"]
  order-db:
    ports: !reset []
  kafka:
    ports: !reset []
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    ports:
      - "127.0.0.1:28080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
